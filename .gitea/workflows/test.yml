# CI — runs the PerformancePlus test pyramid on every push/PR.
#
# This is the gate that would have caught this session's regressions (the 53
# stripped firestore.rules guards + the silently-red unit tests): no green, no
# merge. Gitea Actions uses GitHub-Actions-compatible syntax; it requires a
# runner labelled `ubuntu-latest` (or adjust `runs-on`) with network access to
# resolve the `actions/*` actions and the Firestore emulator jar.
#
# Layers:
#   unit-and-rules — frontend Vitest unit tests + Firestore rules tests (emulator, needs Java)
#   functions      — Cloud Functions Vitest unit tests
#   e2e            — Playwright smoke; OPT-IN (manual dispatch + creds), never blocks PRs
name: tests

on:
  push:
    branches: [main, pentest-findings]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Firestore emulator needs a JRE.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Frontend unit tests
        run: npm test
      - name: Install firebase-tools (emulator runner)
        run: npm i -g firebase-tools
      - name: Firestore rules tests (emulator)
        run: npm run test:rules

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Functions unit tests
        run: npm test
        working-directory: functions

  # E2E is intentionally OPT-IN: it needs a deployed STAGING target + login creds,
  # so it must never gate ordinary PRs. Trigger manually (workflow_dispatch) with
  # E2E_TEST_EMAIL / E2E_TEST_PASSWORD / E2E_BASE_URL provided as Gitea secrets.
  # Targets STAGING only — never production.
  e2e:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (staging)
        run: npm run test:e2e
